kotlin.code.style=official

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Browser (Karma + headless Chrome) tests are slow and need a browser installed, so they
# are off by default and run as a single dedicated CI job. Enable with -PbrowserTests=true.
browserTests=false
