<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Cartographer">
    <!--
      The Ground Reader. A map face divided into rooms and corridors, with a bright compass needle
      choosing one connected region. It measures path, local shape, room and owned ground once.
    -->
    <defs>
        <clipPath id="tile">
            <rect width="96" height="96" rx="18"/>
        </clipPath>
    </defs>
    <rect width="96" height="96" rx="18" fill="#16191d"/>
    <g clip-path="url(#tile)">
        <path d="M8 14h80v68H8z" fill="#22503c"/>
        <path d="M8 14h34v26H8zm42 0h38v18H50zM8 48h24v34H8zm32-8h48v42H40z" fill="#2b6046"/>
        <path d="M42 14h8v26h-8zm-10 26h56v8H32zm0 8h8v34h-8z" fill="#0e1114"/>

        <!-- The compass is also a head choosing east through the mapped doorway. -->
        <circle cx="60" cy="60" r="20" fill="#4c9f74"/>
        <circle cx="60" cy="60" r="13" fill="#16191d"/>
        <path d="M54 66l8-20 5 13 13 5-20 8z" fill="#7fe0a8"/>
        <rect x="57" y="57" width="6" height="6" fill="#e9f2ec"/>
        <path d="M12 18h26v5H12zm42 0h28v5H54z" fill="#3a7f5c"/>
    </g>
</svg>
