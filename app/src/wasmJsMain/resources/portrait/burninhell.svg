<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Burnin Hell">
    <!--
      The Sweeper. A furnace with a face: the element behind its grille is the boustrophedon itself,
      down one column, across, up the next. It fills the board in stripes and never looks at you.
    -->
    <defs>
        <clipPath id="tile">
            <rect width="96" height="96" rx="18"/>
        </clipPath>
    </defs>
    <rect width="96" height="96" rx="18" fill="#16191d"/>
    <g clip-path="url(#tile)">
        <path d="M4 96V82l16-8h56l16 8v14z" fill="#2b6046"/>
        <rect x="38" y="70" width="20" height="12" fill="#22503c"/>

        <rect x="12" y="14" width="72" height="60" fill="#4c9f74"/>
        <rect x="12" y="14" width="72" height="7" fill="#5fbf8a"/>
        <rect x="74" y="21" width="10" height="53" fill="#3a7f5c"/>

        <rect x="22" y="24" width="16" height="10" fill="#a8f0c8"/>
        <rect x="58" y="24" width="16" height="10" fill="#a8f0c8"/>
        <rect x="22" y="28" width="16" height="3" fill="#0e1114"/>
        <rect x="58" y="28" width="16" height="3" fill="#0e1114"/>

        <!-- The element, alight: down, across the bottom, up, across the top, down again. -->
        <rect x="18" y="40" width="60" height="28" fill="#0e1114"/>
        <rect x="24" y="44" width="7" height="20" fill="#a8f0c8"/>
        <rect x="45" y="44" width="7" height="20" fill="#a8f0c8"/>
        <rect x="66" y="44" width="7" height="20" fill="#a8f0c8"/>
        <rect x="24" y="57" width="28" height="7" fill="#a8f0c8"/>
        <rect x="45" y="44" width="28" height="7" fill="#a8f0c8"/>
    </g>
</svg>
