<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Burnin Hell">
    <!-- A boustrophedon sweep: down one column, across, up the next, filling the board in stripes. -->
    <rect width="32" height="32" rx="6" fill="#16191d"/>
    <rect x="4" y="4" width="6" height="24" fill="#3a7f5c"/>
    <rect x="4" y="23" width="15" height="5" fill="#4c9f74"/>
    <rect x="13" y="4" width="6" height="24" fill="#4c9f74"/>
    <rect x="13" y="4" width="15" height="5" fill="#5fbf8a"/>
    <rect x="22" y="4" width="6" height="24" fill="#7fe0a8"/>
</svg>
