    <rect x="4" y="5" width="24" height="7" fill="#5fbf8a"/>
    <rect x="13" y="13" width="6" height="6" fill="#7fe0a8"/>
    <rect x="4" y="20" width="24" height="7" fill="#5fbf8a"/>
</svg>
