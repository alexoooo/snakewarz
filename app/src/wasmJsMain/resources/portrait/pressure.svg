<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Pressure">
    <!--
      The Crowder. Heavy brow, heavier jaw, and one eye trapped in the gap between them: the two
      slabs of the old mark, worn as a face. It plays for the room the other snake loses.
    -->
    <defs>
        <clipPath id="tile">
            <rect width="96" height="96" rx="18"/>
        </clipPath>
    </defs>
    <rect width="96" height="96" rx="18" fill="#16191d"/>
    <g clip-path="url(#tile)">
        <!-- The slabs it closes with, reaching past the edge on both sides. -->
        <rect x="0" y="6" width="96" height="10" fill="#22503c"/>
        <rect x="0" y="80" width="96" height="10" fill="#22503c"/>

        <path d="M0 96V72l24-8h48l24 8v24z" fill="#2b6046"/>
        <path d="M0 96V72l24-8h24v32z" fill="#3a7f5c"/>

        <rect x="20" y="22" width="56" height="44" fill="#4c9f74"/>
        <rect x="20" y="22" width="56" height="8" fill="#5fbf8a"/>
        <rect x="66" y="30" width="10" height="36" fill="#3a7f5c"/>

        <rect x="14" y="32" width="68" height="9" fill="#0e1114"/>
        <rect x="14" y="57" width="68" height="9" fill="#0e1114"/>
        <rect x="37" y="43" width="22" height="12" fill="#e9f2ec"/>
        <rect x="43" y="45" width="10" height="8" fill="#0e1114"/>
    </g>
</svg>
