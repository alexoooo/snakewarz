<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="PUCT">
    <!--
      The Planner. A visor with one lens lit, under a crest that is the old mark whole: two siblings
      left as stubs and one line climbed hard, brightening as it goes. The hunch says where to spend.
    -->
    <defs>
        <clipPath id="tile">
            <rect width="96" height="96" rx="18"/>
        </clipPath>
    </defs>
    <rect width="96" height="96" rx="18" fill="#16191d"/>
    <g clip-path="url(#tile)">
        <rect x="16" y="24" width="9" height="6" fill="#2b6046"/>
        <rect x="29" y="20" width="9" height="6" fill="#2b6046"/>
        <rect x="42" y="14" width="11" height="8" fill="#4c9f74"/>
        <rect x="57" y="8" width="11" height="8" fill="#5fbf8a"/>
        <rect x="72" y="2" width="13" height="8" fill="#7fe0a8"/>

        <path d="M2 96V80l20-8h52l20 8v16z" fill="#2b6046"/>
        <path d="M2 96V80l20-8h26v24z" fill="#3a7f5c"/>
        <rect x="40" y="62" width="16" height="14" fill="#22503c"/>

        <rect x="24" y="30" width="48" height="42" fill="#4c9f74"/>
        <rect x="24" y="30" width="48" height="6" fill="#5fbf8a"/>
        <rect x="62" y="36" width="10" height="36" fill="#3a7f5c"/>

        <!-- One lens lit and one dark, the same asymmetry the crest above it draws. -->
        <rect x="16" y="40" width="64" height="14" fill="#0e1114"/>
        <rect x="22" y="43" width="22" height="8" fill="#3a7f5c"/>
        <rect x="52" y="43" width="22" height="8" fill="#a8f0c8"/>
        <rect x="36" y="62" width="24" height="4" fill="#22503c"/>
    </g>
</svg>
