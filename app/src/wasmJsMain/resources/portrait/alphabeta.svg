<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Alpha-Beta">
    <!--
      The Oracle. A crowned helm whose whole face is the old mark: two bounds closing on the bright
      window between them, and nothing outside it ever looked at. There is no expression to read.
    -->
    <defs>
        <clipPath id="tile">
            <rect width="96" height="96" rx="18"/>
        </clipPath>
    </defs>
    <rect width="96" height="96" rx="18" fill="#16191d"/>
    <g clip-path="url(#tile)">
        <rect x="24" y="4" width="9" height="16" fill="#3a7f5c"/>
        <rect x="43" y="0" width="10" height="20" fill="#5fbf8a"/>
        <rect x="63" y="4" width="9" height="16" fill="#3a7f5c"/>

        <path d="M0 96V78l24-8h48l24 8v18z" fill="#2b6046"/>
        <path d="M0 96V78l24-8h24v26z" fill="#3a7f5c"/>
        <rect x="40" y="62" width="16" height="12" fill="#22503c"/>

        <rect x="20" y="16" width="56" height="52" fill="#4c9f74"/>
        <rect x="20" y="16" width="56" height="6" fill="#5fbf8a"/>
        <rect x="66" y="22" width="10" height="46" fill="#3a7f5c"/>

        <!-- Closing on the window, from both sides, in the same steps the search takes. -->
        <rect x="12" y="28" width="72" height="6" fill="#22503c"/>
        <rect x="20" y="36" width="56" height="6" fill="#2b6046"/>
        <rect x="28" y="44" width="40" height="4" fill="#3a7f5c"/>
        <rect x="12" y="50" width="72" height="5" fill="#a8f0c8"/>
        <rect x="28" y="57" width="40" height="4" fill="#3a7f5c"/>
        <rect x="20" y="63" width="56" height="6" fill="#2b6046"/>
    </g>
</svg>
