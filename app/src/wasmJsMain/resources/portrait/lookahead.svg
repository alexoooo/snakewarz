<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Lookahead">
    <!--
      The Scout. Three nested sight frames mark its fixed three-ply horizon; the bright opening at
      the end is the leaf it appraises, while the split visor keeps the drawing a face.
    -->
    <defs>
        <clipPath id="tile">
            <rect width="96" height="96" rx="18"/>
        </clipPath>
    </defs>
    <rect width="96" height="96" rx="18" fill="#16191d"/>
    <g clip-path="url(#tile)">
        <path d="M8 78l12-54 28-16 28 16 12 54-18 18H26z" fill="#22503c"/>
        <path d="M20 24L48 8v88H26L8 78z" fill="#2b6046"/>
        <path d="M18 72V30h60v42H68V40H28v32z" fill="#3a7f5c"/>
        <path d="M28 68V40h40v28H60V48H36v20z" fill="#4c9f74"/>
        <path d="M36 64V48h24v16H52v-8h-8v8z" fill="#7fe0a8"/>

        <!-- The two near branches frame one bright horizon rather than becoming a diagram. -->
        <path d="M18 72h22l8 10 8-10h22v14H58L48 96 38 86H18z" fill="#0e1114"/>
        <rect x="28" y="54" width="8" height="8" fill="#e9f2ec"/>
        <rect x="60" y="54" width="8" height="8" fill="#e9f2ec"/>
        <rect x="30" y="56" width="4" height="4" fill="#16191d"/>
        <rect x="62" y="56" width="4" height="4" fill="#16191d"/>
        <path d="M44 56h8v8h-8z" fill="#a8f0c8"/>
    </g>
</svg>
