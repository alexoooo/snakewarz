<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Space Filler">
    <!--
      Room Reader. A surveyor in wide lenses, in front of the flood spreading out of one corner and
      fading. It is counting the room a move would leave, and it is not looking at you.
    -->
    <defs>
        <clipPath id="tile">
            <rect width="96" height="96" rx="18"/>
        </clipPath>
    </defs>
    <rect width="96" height="96" rx="18" fill="#16191d"/>
    <g clip-path="url(#tile)">
        <!-- The flood, brightest where it started and gone before it reaches the far corner. -->
        <rect x="2" y="2" width="28" height="28" fill="#2b6046"/>
        <rect x="34" y="2" width="28" height="28" fill="#22503c"/>
        <rect x="2" y="34" width="28" height="28" fill="#22503c"/>

        <path d="M4 96V80l20-8h48l20 8v16z" fill="#2b6046"/>
        <path d="M4 96V80l20-8h24v24z" fill="#3a7f5c"/>
        <rect x="40" y="58" width="16" height="16" fill="#22503c"/>

        <rect x="20" y="20" width="56" height="44" fill="#4c9f74"/>
        <rect x="20" y="20" width="56" height="8" fill="#5fbf8a"/>
        <rect x="66" y="28" width="10" height="36" fill="#3a7f5c"/>

        <!-- Two wide lenses: everything it has is pointed at how much room is left. -->
        <rect x="14" y="32" width="68" height="18" fill="#0e1114"/>
        <rect x="20" y="35" width="24" height="12" fill="#a8f0c8"/>
        <rect x="52" y="35" width="24" height="12" fill="#7fe0a8"/>
        <rect x="38" y="54" width="20" height="4" fill="#22503c"/>
    </g>
</svg>
