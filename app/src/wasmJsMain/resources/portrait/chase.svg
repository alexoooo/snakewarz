<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Chaser">
    <!--
      The Hunter. The old mark's arrow is now the head itself: a wedge leaning forward and narrowing
      to a bright snout, with two slit eyes and a set of teeth. It walks the shortest path to a head.
    -->
    <defs>
        <clipPath id="tile">
            <rect width="96" height="96" rx="18"/>
        </clipPath>
    </defs>
    <rect width="96" height="96" rx="18" fill="#16191d"/>
    <g clip-path="url(#tile)">
        <path d="M0 96V84l22-10h50l22 10v12z" fill="#2b6046"/>
        <path d="M0 96V84l22-10h26v22z" fill="#3a7f5c"/>
        <rect x="34" y="66" width="20" height="12" fill="#22503c"/>

        <!-- The wedge: (16,24) to a point on the right, which is where it is going. -->
        <path d="M16 24h44l20 20v8L60 72H16z" fill="#4c9f74"/>
        <rect x="16" y="24" width="44" height="8" fill="#5fbf8a"/>
        <rect x="16" y="64" width="44" height="8" fill="#3a7f5c"/>
        <path d="M60 52h20L60 72z" fill="#3a7f5c"/>
        <rect x="66" y="42" width="12" height="12" fill="#7fe0a8"/>

        <path d="M24 40l18-5v9l-18 5z" fill="#e9f2ec"/>
        <path d="M48 36l16-4v9l-16 4z" fill="#e9f2ec"/>
        <rect x="22" y="55" width="34" height="6" fill="#0e1114"/>
        <rect x="28" y="55" width="6" height="6" fill="#e9f2ec"/>
        <rect x="40" y="55" width="6" height="6" fill="#e9f2ec"/>
    </g>
</svg>
