<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Chaser">
    <!-- An arrow narrowing to a bright point: it steers down the shortest path to a head. -->
    <rect width="32" height="32" rx="6" fill="#16191d"/>
    <rect x="4" y="13" width="13" height="6" fill="#3a7f5c"/>
    <rect x="17" y="9" width="4" height="14" fill="#4c9f74"/>
    <rect x="21" y="12" width="4" height="8" fill="#5fbf8a"/>
    <rect x="25" y="14" width="4" height="4" fill="#7fe0a8"/>
</svg>
