<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Wall Hugger">
    <!--
      The Hugger. A sentry with its shoulder against the nearest wall, wearing a crest that comes
      off that wall, over the crown and one turn inward, which is the whole of what it does.
    -->
    <defs>
        <clipPath id="tile">
            <rect width="96" height="96" rx="18"/>
        </clipPath>
    </defs>
    <rect width="96" height="96" rx="18" fill="#16191d"/>
    <g clip-path="url(#tile)">
        <!-- The wall it keeps on one side. -->
        <rect x="0" y="0" width="16" height="96" fill="#22503c"/>
        <rect x="12" y="0" width="4" height="96" fill="#2b6046"/>

        <path d="M14 96V78l18-8h44l18 8v18z" fill="#2b6046"/>
        <path d="M14 96V78l18-8h16v26z" fill="#3a7f5c"/>
        <rect x="42" y="60" width="14" height="14" fill="#22503c"/>

        <rect x="26" y="22" width="48" height="44" fill="#4c9f74"/>
        <rect x="26" y="22" width="10" height="44" fill="#5fbf8a"/>
        <rect x="62" y="22" width="12" height="44" fill="#3a7f5c"/>

        <!-- Off the wall, across the crown, and one turn in, brightening as it winds. -->
        <rect x="14" y="10" width="30" height="7" fill="#3a7f5c"/>
        <rect x="37" y="10" width="7" height="24" fill="#5fbf8a"/>
        <rect x="37" y="27" width="27" height="7" fill="#a8f0c8"/>

        <rect x="32" y="40" width="36" height="11" fill="#0e1114"/>
        <rect x="34" y="42" width="9" height="7" fill="#a8f0c8"/>
        <rect x="47" y="42" width="9" height="7" fill="#a8f0c8"/>
        <rect x="36" y="56" width="28" height="4" fill="#22503c"/>
    </g>
</svg>
